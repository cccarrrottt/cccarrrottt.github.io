# The chart's write service. See index.js for what it does and why.
#
# Deployed from CI on every push to main (the "Deploy the write service" job),
# once the repository has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets. Its own three secrets — GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET and
# SESSION_SECRET — are set once in the Cloudflare dashboard (Worker →
# Settings → Variables and Secrets) and a deploy leaves them alone.
#
# Cloudflare builds this from the repository on every push (Workers Builds,
# root directory `worker`), and a connected build refuses a config whose name
# differs from the Worker it is connected to — so this is that Worker's name,
# renamed in the dashboard. The address it makes,
# https://rhizome-api.<account>.workers.dev, has to match `api` in
# src/app/00-config.js.
#
# It was called cccarrrottt-github-io, after the repository, and the address
# that made had "github-io" in it: Chrome's lookalike check read the sign-in
# window as a site pretending to be github.io and stopped it with a warning
# every time. A name with no other site's name in it is the whole fix.
#
# worker/package-lock.json is there for that build, though the service has no
# dependencies: once the repository's root carries a lockfile, Workers Builds
# installs with `npm clean-install`, which refuses a directory without one.
name = "rhizome-api"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Plain settings only. GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET and
# SESSION_SECRET must NOT be written here: this file is public, and a value
# under [vars] collides with the secret of the same name — the deploy either
# fails or the service runs with what stands here instead of the real thing.
# They are set once in the Cloudflare dashboard, as Secrets.
# tests/worker.js refuses this file if any of them appears in it.
[vars]
REPO = "cccarrrottt/cccarrrottt.github.io"
BRANCH = "main"
OWNERS = "cccarrrottt"
ALLOWED_ORIGINS = "https://cccarrrottt.github.io"

# Keeps what the service writes to its console, so the owner can read it in
# the dashboard (the Worker → Logs): sign-in failures, and the faults the
# site's readers meet, which the page sends to POST /report.
[observability]
enabled = true
