<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Three entries and the lines between them, on the chart's ink. Kept
       inside the middle 80% so that a launcher cutting it to a circle or a
       squircle cuts only the ground. -->
