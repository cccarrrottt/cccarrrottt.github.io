  <g fill="none" stroke="#c23b22" stroke-width="18" stroke-linejoin="miter">
    <path d="M196 170 H256 V342 H316"/>
    <path d="M256 256 H316"/>
  </g>
  <g fill="#ffffff">
    <rect x="96" y="132" width="112" height="76" rx="10"/>
    <rect x="304" y="218" width="112" height="76" rx="10"/>
    <rect x="304" y="304" width="112" height="76" rx="10"/>
  </g>
</svg>
