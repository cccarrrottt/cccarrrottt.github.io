# What a push has to survive.
#
# Three things are checked, and they answer different questions:
#
#   build.py              can the split sources still be welded into one page
#   tests/build_guard.py  does the welded page match what src/ says it should
#   tools/lint.py         does the program, assembled and read as one scope,
#                         still have no undefined, unused or twice-declared name
#   tests/regression.js   does the page still DO what it did, in a real browser
#   tests/worker.js       does the write service still refuse what it must
#
# The regression suite runs twice, against two different things: `dist` drives
# the built single file, `src` drives the same program served as separate
# files through src/index.html. They exercise different loading paths, so a
# green run on one says nothing about the other. Each takes around six
# minutes, so they run as two jobs rather than one after the other.
#
# A Save on the site is a commit that changes src/chart.json and nothing else,
# but for the pictures it adds beside it in src/media/.
# That is the chart's content, not the program, and the owner asked not to
# wait minutes of browser tests to see it published; so such a push skips
# every check and goes straight to Pages. Anything else in the same push — a
# code change, a second file — runs the whole of it, as do pull requests.
#
# dist/ is not in the repository — it is rebuilt here, attached to the run as
# an artifact, and, on main, dist/site/ becomes the published site — the same
# page, with the program beside it rather than inside, which is a reader there
# for everybody but the signed-in owner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless, so it is
# cancelled. On main it is not: a run there is a publish, and cancelling one
# half way left the next push to decide alone what to publish. A Save made
# while a merged code change was still being checked cancelled that check,
# was itself "only data", and published the unchecked code with it — and
# skipped deploying the write service the code expected. Runs on main now
# finish in order. (GitHub still drops a run that is only WAITING when a
# newer one queues; which is why "only data" is decided against what was
# last published, below, not against the push before.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is this push only the chart's data? Answered from the trees, not from the
  # commit message, so a code change can never ride along unchecked — and
  # against the commit the site was last published from, not against the
  # push before this one. The push before may never have been checked: its
  # run can have been dropped while it waited. Compared with it, a Save on
  # top of an unchecked code change looked like "only data" and published
  # the code. Compared with the last run on main that succeeded, the code is
  # in the difference and everything runs. No such run, or none that can be
  # fetched, counts as code.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      data_only: ${{ steps.diff.outputs.data_only }}
    steps:
      - uses: actions/checkout@v4

      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          data_only=false
          BASE=""
          if [ "$IS_PUSH" = true ]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                     --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          fi
          echo "Last published: ${BASE:-none found}"
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE"; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "Changed: $files"
            # The chart, and the pictures a Save puts beside it.
            others=$(printf '%s\n' "$files" | grep -v -e '^src/chart\.json$' -e '^src/media/[^/]*$' || true)
            [ -n "$files" ] && [ -z "$others" ] && data_only=true
          fi
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"
          echo "Only the chart's data: $data_only"

  build:
    name: Build, guard and lint
    needs: changes
    if: needs.changes.outputs.data_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Exactly what package-lock.json says, so a run cannot pick up a
      # newer eslint or ajv than the one the checks were written against.
      - name: Install eslint
        run: npm ci --no-audit --no-fund

      # The chart reads as one and fits its schema: the same check a
      # data-only push is published on (see the pages job).
      - name: The chart is the chart
        run: node tools/chart_check.js

      # esbuild came with the install above. Required, so a run where it is
      # missing fails rather than quietly publishing the program unminified.
      - name: Build
        env:
          RHIZOME_MINIFY: required
        run: python3 build.py

      - name: Build guard
        run: python3 tests/build_guard.py

      - name: Lint
        run: npm run lint

      - name: Write service
        run: node tests/worker.js

      - name: Keep the built page with the run
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # The suite is a set of named scenarios and they do not depend on one another —
  # which is checked rather than assumed: four shards print exactly the checks
  # one whole run prints, by name. So they run as shards, and a regression job
  # is about a minute and a half instead of six.
  test:
    name: Regression (${{ matrix.target }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [dist, src]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The src suite serves src/ directly, but building first is what proves
      # the checkout is whole, and it costs seconds.
      - name: Build
        run: python3 build.py

      - name: Run the suite
        run: node tests/regression.js ${{ matrix.target == 'src' && 'src' || '' }} --shard=${{ matrix.shard }}/4

  pages:
    name: Publish to Pages
    # After the checks when they ran and passed, or at once when the push was
    # only data and they were skipped. Never after a failure or a cancel.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && (needs.changes.outputs.data_only == 'true'
          || (needs.build.result == 'success' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    needs: [changes, build, test]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Only the minifier, at the version package.json pins: the site's
      # program and stylesheet go out minified, and a data-only push comes
      # straight here without the build job's install. Nothing else from
      # package.json is needed to build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the minifier
        run: |
          v=$(node -p "require('./package.json').devDependencies.esbuild")
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/esb" "esbuild@$v"

      # A data-only push comes here without the build job, and so without
      # the browser suite — the owner asked not to wait for it. What it is
      # not published without is this: the chart reads as one (the reader
      # the write service takes a save with), and it fits its schema. A
      # chart the page cannot read stops here — and so would one the build
      # cannot, which refuses a chart.json that is not JSON.
      - name: The chart is the chart
        run: |
          v=$(node -p "require('./package.json').devDependencies.ajv")
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/ajv" "ajv@$v"
          NODE_PATH="$RUNNER_TEMP/ajv/node_modules" node tools/chart_check.js

      # The visitor counter's token is a repository variable, not a secret:
      # it is printed into every page anyway. Unset, the site has no counter.
      - name: Build
        env:
          RHIZOME_MINIFY: required
          ESBUILD: ${{ runner.temp }}/esb/node_modules/.bin/esbuild
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        run: python3 build.py

      # The chart drawn once into the site's page, so a reader sees it before
      # the program has arrived (tools/prerender.js). It drives the Chrome
      # the runner already has, so nothing is downloaded but the library; and
      # it never fails the publish — a page without the drawing is only
      # slower to show.
      - name: Draw the chart into the page
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          v=$(node -p "require('./package.json').devDependencies.playwright")
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/pw" "playwright@$v" \
            && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/prerender.js \
            || echo "prerender: skipped, the page is published as built"

      # The build's site: the page, with its program and stylesheet beside
      # it in files named by their hash, so a Save does not make every
      # reader download them again (build_site in build.py). On this address
      # it opens as a reader, and becomes an editor only for the owner, once
      # the write service has confirmed the sign-in — see SITE_ORIGINS in
      # src/app/01-store.js. Beside it, what makes it an app a phone can keep
      # and open with no signal — the manifest, the icons and the worker in
      # src/site/, which the build copied — and the chart's pictures.
      - name: Stage the site
        run: |
          cp -r dist/site _site
          if [ -d dist/media ]; then cp -r dist/media _site/media; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # The write service (worker/), deployed to Cloudflare from main.
  #
  # Skipped, with a line saying so, until the repository has the two secrets
  # it needs — so a fork, or this repository before the service is set up,
  # stays green. The service's own secrets (the GitHub App's id and secret,
  # and the session key) live in Cloudflare and a deploy leaves them alone.
  worker:
    name: Deploy the write service
    # After the browser suite as well as the service's own tests, as the
    # site is: the page and the service it talks to go out on the same
    # evidence. A data-only push skips build, and with it this: the service
    # did not change.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets in this repository; the write service is not deployed."
            exit 0
          fi
          # An exact version: a deploy is not the place to meet a new one.
          npx --yes wrangler@4.150.0 deploy
