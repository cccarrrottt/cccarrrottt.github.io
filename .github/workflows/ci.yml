# What a push has to survive.
#
# Three things are checked, and they answer different questions:
#
#   build.py              can the split sources still be welded into one page
#   tests/build_guard.py  does the welded page match what src/ says it should
#   tools/lint.py         does the program, assembled and read as one scope,
#                         still have no undefined, unused or twice-declared name
#   tests/regression.js   does the page still DO what it did, in a real browser
#   tests/snapshots.js    does it still LOOK as it did, by the pixel
#   tests/worker.js       does the write service still refuse what it must
#
# and a few of the suite's scenarios again in WebKit, the engine of every
# browser on an iPhone, which the rest of the suite's Chromium cannot speak for.
#
# The regression suite runs twice, against two different things: `dist` drives
# the built single file, `src` drives the same program served as separate
# files through src/index.html. They exercise different loading paths, so a
# green run on one says nothing about the other. Each takes around six
# minutes, so they run as two jobs rather than one after the other.
#
# A Save on the site is a commit that changes src/chart.json and nothing else,
# but for the pictures it adds beside it in src/media/.
# That is the chart's content, not the program, and the owner asked not to
# wait minutes of browser tests to see it published; so such a push skips
# every check and goes straight to Pages. Anything else in the same push — a
# code change, a second file — runs the whole of it, as do pull requests.
#
# dist/ is not in the repository — it is rebuilt here, attached to the run as
# an artifact, and, on main, dist/site/ becomes the published site — the same
# page, with the program beside it rather than inside, which is a reader there
# for everybody but the signed-in owner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand, or by the write service: after a Save to a chart kept in
  # another repository (nothing here moved, so nothing else publishes it),
  # and after the owner moves the chart (POST /place), when the service is
  # deployed again too, so it is told the new place (`service`). With no
  # code changed since the last publish, it is a data-only run (below).
  workflow_dispatch:
    inputs:
      service:
        description: Deploy the write service as well, even when no code changed
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless, so it is
# cancelled. On main it is not: a run there is a publish, and cancelling one
# half way left the next push to decide alone what to publish. A Save made
# while a merged code change was still being checked cancelled that check,
# was itself "only data", and published the unchecked code with it — and
# skipped deploying the write service the code expected. Runs on main now
# finish in order. (GitHub still drops a run that is only WAITING when a
# newer one queues; which is why "only data" is decided against what was
# last published, below, not against the push before.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Where this copy lives: its site, its write service, its repository,
  # where its chart is kept, who may edit (tools/where.py). Worked out from
  # where the run is — the repository, its variables, its own Cloudflare
  # account — so a fork publishes itself without changing a file of ours.
  # For this repository it is what 00-config.js and wrangler.toml say.
  # Only what is PUBLISHED asks it: the checks build with 00-config.js as
  # it stands, because that is what the suite reads.
  where:
    name: Where this copy lives
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.where.outputs.site }}
      api: ${{ steps.where.outputs.api }}
      repo: ${{ steps.where.outputs.repo }}
      data: ${{ steps.where.outputs.data }}
      owners: ${{ steps.where.outputs.owners }}
      editors: ${{ steps.where.outputs.editors }}
      origins: ${{ steps.where.outputs.origins }}
      upstream: ${{ steps.where.outputs.upstream }}
      data_repo: ${{ steps.where.outputs.data_repo }}
      data_path: ${{ steps.where.outputs.data_path }}
      data_branch: ${{ steps.where.outputs.data_branch }}
      data_here: ${{ steps.where.outputs.data_here }}
      media_dir: ${{ steps.where.outputs.media_dir }}
      deploy: ${{ steps.where.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - id: where
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RHIZOME_SITE: ${{ vars.RHIZOME_SITE }}
          RHIZOME_API: ${{ vars.RHIZOME_API }}
          RHIZOME_DATA: ${{ vars.RHIZOME_DATA }}
          RHIZOME_OWNERS: ${{ vars.RHIZOME_OWNERS }}
          RHIZOME_EDITORS: ${{ vars.RHIZOME_EDITORS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/where.py | tee -a "$GITHUB_STEP_SUMMARY"

  # Is this push only the chart's data? Answered from the trees, not from the
  # commit message, so a code change can never ride along unchecked — and
  # against the commit the site was last published from, not against the
  # push before this one. The push before may never have been checked: its
  # run can have been dropped while it waited. Compared with it, a Save on
  # top of an unchecked code change looked like "only data" and published
  # the code. Compared with the last run on main that succeeded, the code is
  # in the difference and everything runs. No such run, or none that can be
  # fetched, counts as code.
  changes:
    name: What changed
    needs: where
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      data_only: ${{ steps.diff.outputs.data_only }}
    steps:
      - uses: actions/checkout@v5

      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DATA_HERE: ${{ needs.where.outputs.data_here }}
          DATA_PATH: ${{ needs.where.outputs.data_path }}
          MEDIA_DIR: ${{ needs.where.outputs.media_dir }}
        run: |
          data_only=false
          BASE=""
          # A pull request's run is never "only data": it publishes nothing,
          # and its checks are the point of it.
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
                     --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          fi
          echo "Last published: ${BASE:-none found}"
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE"; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "Changed: $files"
            # The chart, and the pictures a Save puts beside it — when the
            # chart is kept in this repository at all (tools/where.py); kept
            # in another, every push here is code.
            if [ "$DATA_HERE" = true ]; then
              others=$(printf '%s\n' "$files" | awk -v f="$DATA_PATH" -v m="$MEDIA_DIR/" \
                '$0 != f && !(index($0, m) == 1 && index(substr($0, length(m) + 1), "/") == 0)')
            else
              others=$files
            fi
            [ -n "$files" ] && [ -z "$others" ] && data_only=true
            # Asked to publish again with nothing changed here: the chart
            # moved, or is kept elsewhere and was saved there.
            [ "$EVENT" = workflow_dispatch ] && [ -z "$files" ] && data_only=true
          fi
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"
          echo "Only the chart's data: $data_only"

  build:
    name: Build, guard and lint
    needs: changes
    if: needs.changes.outputs.data_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Exactly what package-lock.json says, so a run cannot pick up a
      # newer eslint or ajv than the one the checks were written against.
      - name: Install eslint
        run: npm ci --no-audit --no-fund

      # The chart reads as one and fits its schema: the same check a
      # data-only push is published on (see the pages job).
      - name: The chart is the chart
        run: node tools/chart_check.js

      # esbuild came with the install above. Required, so a run where it is
      # missing fails rather than quietly publishing the program unminified.
      - name: Build
        env:
          RHIZOME_MINIFY: required
        run: python3 build.py

      - name: Build guard
        run: python3 tests/build_guard.py

      - name: Lint
        run: npm run lint

      - name: Write service
        run: node tests/worker.js

      - name: Keep the built page with the run
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 14

  # The suite is a set of named scenarios and they do not depend on one another —
  # which is checked rather than assumed: four shards print exactly the checks
  # one whole run prints, by name. So they run as shards, and a regression job
  # is about a minute and a half instead of six.
  test:
    name: Regression (${{ matrix.target }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [dist, src]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # --with-deps asks apt for the system packages Chromium wants, most of
      # them fonts the runner image already has. On 11.11 the runners could
      # not resolve Ubuntu's mirrors for hours, and every shard of a green
      # change went red before a test ran — twice. apt is tried three times;
      # if the mirrors are still gone the browser is installed on its own,
      # with what the image carries, and the run says so. Each try is held
      # to five minutes: the same day one shard's apt stopped answering
      # altogether and the step stood for over half an hour.
      - name: Install Playwright
        timeout-minutes: 20
        run: |
          npm ci --no-audit --no-fund
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Installing Chromium with its system packages failed (attempt $i)"; sleep $((i * 15))
          done
          echo "::warning::Ubuntu's package mirrors were unreachable; Chromium installed without its system packages"
          npx playwright install chromium

      # The src suite serves src/ directly, but building first is what proves
      # the checkout is whole, and it costs seconds.
      - name: Build
        run: python3 build.py

      - name: Run the suite
        run: node tests/regression.js ${{ matrix.target == 'src' && 'src' || '' }} --shard=${{ matrix.shard }}/4

  # The look, compared by the pixel with tests/snapshots/*.png. Those
  # pictures are drawn by the browser package-lock.json's Playwright names,
  # on Linux, and only that browser on Linux draws them alike; so they are
  # compared here and nowhere else that matters. A run that differs keeps
  # what it drew, and where it differs, with the run.
  snapshots:
    name: Snapshots
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # As for the suite, and for the same reason.
      - name: Install Playwright
        timeout-minutes: 20
        run: |
          npm ci --no-audit --no-fund
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Installing Chromium with its system packages failed (attempt $i)"; sleep $((i * 15))
          done
          echo "::warning::Ubuntu's package mirrors were unreachable; Chromium installed without its system packages"
          npx playwright install chromium

      - name: Build
        run: python3 build.py

      - name: Compare the pictures
        run: node tests/snapshots.js

      - name: Keep what was drawn
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshots
          path: tests/snapshots/out/
          retention-days: 14

  # A few of the suite's scenarios in WebKit: the page opening and drawing,
  # undo, the panels, search, adding entries, export and import, a merge,
  # and panning about the field. The rest of the suite drives Chromium,
  # which is not what any reader on an iPhone has.
  webkit:
    name: Regression in WebKit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # WebKit needs more of the system than Chromium does, so there is no
      # falling back to installing it without its packages.
      - name: Install Playwright
        timeout-minutes: 20
        run: |
          npm ci --no-audit --no-fund
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps webkit && exit 0
            echo "Installing WebKit with its system packages failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1

      - name: Build
        run: python3 build.py

      - name: Run the scenarios
        run: >-
          node tests/regression.js --browser=webkit
          "--only=boot|undo / redo|panels open|search|node creation, every archetype|export / import round-trip|the amalgam junction bead|the field: whole pages"

  pages:
    name: Publish to Pages
    # After the checks when they ran and passed, or at once when the push was
    # only data and they were skipped. Never after a failure or a cancel.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && (needs.changes.outputs.data_only == 'true'
          || (needs.build.result == 'success' && needs.test.result == 'success'
              && needs.snapshots.result == 'success' && needs.webkit.result == 'success'))
    runs-on: ubuntu-latest
    needs: [where, changes, build, test, snapshots, webkit]
    permissions:
      pages: write
      id-token: write
    # What this copy is published as (tools/where.py), for the build to
    # write in place of 00-config.js's lines, and the chart it draws:
    # src/chart.json, or the file fetched below from another repository.
    env:
      RHIZOME_SITE: ${{ needs.where.outputs.site }}
      RHIZOME_API: ${{ needs.where.outputs.api }}
      RHIZOME_REPO: ${{ needs.where.outputs.repo }}
      RHIZOME_DATA: ${{ needs.where.outputs.data }}
      RHIZOME_CHART: ${{ needs.where.outputs.data_here == 'true' && needs.where.outputs.data_path || format('_data/{0}', needs.where.outputs.data_path) }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The chart, when it is kept in another repository. A public one is
      # read with this run's own token; a private one needs DATA_TOKEN, a
      # token that may read it. Only the chart and its pictures are taken.
      - name: Fetch the chart
        if: needs.where.outputs.data_here != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.where.outputs.data_repo }}
          ref: ${{ needs.where.outputs.data_branch }}
          token: ${{ secrets.DATA_TOKEN || github.token }}
          path: _data
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Only the minifier, at the version package.json pins: the site's
      # program and stylesheet go out minified, and a data-only push comes
      # straight here without the build job's install. Nothing else from
      # package.json is needed to build.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the minifier
        run: |
          v=$(node -p "require('./package.json').devDependencies.esbuild")
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/esb" "esbuild@$v"

      # A data-only push comes here without the build job, and so without
      # the browser suite — the owner asked not to wait for it. What it is
      # not published without is this: the chart reads as one (the reader
      # the write service takes a save with), and it fits its schema. A
      # chart the page cannot read stops here — and so would one the build
      # cannot, which refuses a chart.json that is not JSON.
      - name: The chart is the chart
        run: |
          v=$(node -p "require('./package.json').devDependencies.ajv")
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/ajv" "ajv@$v"
          NODE_PATH="$RUNNER_TEMP/ajv/node_modules" node tools/chart_check.js

      # The visitor counter's token is a repository variable, not a secret:
      # it is printed into every page anyway. Unset, the site has no counter.
      - name: Build
        env:
          RHIZOME_MINIFY: required
          ESBUILD: ${{ runner.temp }}/esb/node_modules/.bin/esbuild
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        run: python3 build.py

      # The chart drawn once into the site's page, so a reader sees it before
      # the program has arrived (tools/prerender.js). It drives the Chrome
      # the runner already has, so nothing is downloaded but the library; and
      # it never fails the publish — a page without the drawing is only
      # slower to show.
      - name: Draw the chart into the page
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          v=$(node -p "require('./package.json').devDependencies.playwright")
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/pw" "playwright@$v" \
            && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/prerender.js \
            || echo "prerender: skipped, the page is published as built"

      # The build's site: the page, with its program and stylesheet beside
      # it in files named by their hash, so a Save does not make every
      # reader download them again (build_site in build.py). On this address
      # it opens as a reader, and becomes an editor only for the owner, once
      # the write service has confirmed the sign-in — see SITE_ORIGINS in
      # src/app/01-store.js. Beside it, what makes it an app a phone can keep
      # and open with no signal — the manifest, the icons and the worker in
      # src/site/, which the build copied — and the chart's pictures.
      - name: Stage the site
        run: |
          cp -r dist/site _site
          if [ -d dist/media ]; then cp -r dist/media _site/media; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub's own side of a publish can miss: on 20.11 deploy-pages found
      # no artifact named github-pages a moment after it was uploaded, and a
      # re-run of the job then found two, so the site stayed behind main for
      # half a day until the whole run was started again by hand. A miss is
      # tried once more after a pause, in the same job, with the one
      # artifact it already has.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before trying the publish again
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy-again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # The write service (worker/), deployed to Cloudflare from main.
  #
  # Told what this copy is (tools/where.py) as variables on the command
  # line, over what wrangler.toml says, so a fork's service names the fork,
  # its site and its owner without a file of ours changed. Skipped, with a
  # line saying so, when there is no service: no Cloudflare secrets, so no
  # address for one. This repository has one, and there a missing secret is
  # a failure (below).
  #
  # The service's own secrets may be kept in Cloudflare (the dashboard), as
  # this repository's are, or here, as Actions secrets named RHIZOME_ and
  # the service's name (GitHub refuses secret names that begin GITHUB_):
  # those that are here are handed to the service on every deploy. A
  # SESSION_SECRET neither place has is made once, at random — never over
  # one the service already has, which would sign every owner out.
  worker:
    name: Deploy the write service
    # After the browser suite as well as the service's own tests, as the
    # site is: the page and the service it talks to go out on the same
    # evidence. A data-only push skips build, and with it this: the service
    # did not change — unless the run was asked for it (`service`, which
    # the service asks after the owner moved the chart, so its DATA names
    # the new place for editors and readers, whose tokens cannot read the
    # variable it is kept in).
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.where.result == 'success' && needs.changes.result == 'success'
      && ((needs.changes.outputs.data_only == 'true' && github.event_name == 'workflow_dispatch'
           && github.event.inputs.service == 'true')
          || (needs.build.result == 'success' && needs.test.result == 'success'
              && needs.snapshots.result == 'success' && needs.webkit.result == 'success'))
    runs-on: ubuntu-latest
    needs: [where, changes, build, test, snapshots, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API: ${{ needs.where.outputs.api }}
          UPSTREAM: ${{ needs.where.outputs.upstream }}
          REPO: ${{ needs.where.outputs.repo }}
          DATA: ${{ needs.where.outputs.data }}
          OWNERS: ${{ needs.where.outputs.owners }}
          EDITORS: ${{ needs.where.outputs.editors }}
          ORIGINS: ${{ needs.where.outputs.origins }}
          S_GITHUB_CLIENT_ID: ${{ secrets.RHIZOME_GITHUB_CLIENT_ID }}
          S_GITHUB_CLIENT_SECRET: ${{ secrets.RHIZOME_GITHUB_CLIENT_SECRET }}
          S_SESSION_SECRET: ${{ secrets.RHIZOME_SESSION_SECRET }}
          S_GITHUB_APP_ID: ${{ secrets.RHIZOME_GITHUB_APP_ID }}
          S_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RHIZOME_GITHUB_APP_PRIVATE_KEY }}
          S_FILE_MARK_SECRET: ${{ secrets.RHIZOME_FILE_MARK_SECRET }}
          S_GOOGLE_CLIENT_ID: ${{ secrets.RHIZOME_GOOGLE_CLIENT_ID }}
          S_GOOGLE_CLIENT_SECRET: ${{ secrets.RHIZOME_GOOGLE_CLIENT_SECRET }}
          S_GOOGLE_API_KEY: ${{ secrets.RHIZOME_GOOGLE_API_KEY }}
          S_GOOGLE_PICKER_KEY: ${{ secrets.RHIZOME_GOOGLE_PICKER_KEY }}
          S_GOOGLE_APP_ID: ${{ secrets.RHIZOME_GOOGLE_APP_ID }}
          S_YANDEX_CLIENT_ID: ${{ secrets.RHIZOME_YANDEX_CLIENT_ID }}
          S_YANDEX_CLIENT_SECRET: ${{ secrets.RHIZOME_YANDEX_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # A fork with no Cloudflare of its own has no service, and its
            # site is read-only for everybody. This repository does have
            # one: there, a skip once left the live service on the code
            # before 0.23.0 — reading a data.js that was gone — while every
            # check stayed green and the owner could no longer edit.
            if [ "$UPSTREAM" = true ]; then
              echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the write service cannot be deployed and the site would talk to an old one. Add them under Settings, Secrets and variables, Actions."
              exit 1
            fi
            echo "No Cloudflare secrets in this repository; the write service is not deployed."
            exit 0
          fi
          if [ -z "$API" ]; then
            echo "This copy names no write service; there is nothing to deploy."
            exit 0
          fi
          # An exact version: a deploy is not the place to meet a new one.
          W="npx --yes wrangler@4.150.0"
          args=(--var "REPO:$REPO" --var "DATA:$DATA" --var "OWNERS:$OWNERS" --var "ALLOWED_ORIGINS:$ORIGINS")
          if [ -n "$EDITORS" ]; then args+=(--var "EDITORS:$EDITORS"); fi
          $W deploy "${args[@]}"

          # The secrets kept here, handed over in one go.
          python3 - > "$RUNNER_TEMP/secrets.json" <<'PY'
          import json, os
          print(json.dumps({k[2:]: v for k, v in os.environ.items() if k.startswith('S_') and v}))
          PY
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then
            $W secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"

          # A service with no SESSION_SECRET cannot sign anybody in. Made
          # once, only when Cloudflare has listed the service's secrets and
          # it is not among them.
          if [ -z "$S_SESSION_SECRET" ]; then
            listed=$($W secret list --format json 2>/dev/null || true)
            if printf '%s' "$listed" | python3 -c 'import json,sys; l=json.load(sys.stdin); sys.exit(0 if isinstance(l, list) and all(e.get("name") != "SESSION_SECRET" for e in l) else 1)' 2>/dev/null; then
              echo "The service has no SESSION_SECRET; making one."
              openssl rand -hex 32 | $W secret put SESSION_SECRET
            fi
          fi
