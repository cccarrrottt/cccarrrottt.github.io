# What a push has to survive.
#
# Three things are checked, and they answer different questions:
#
#   build.py              can the split sources still be welded into one page
#   tests/build_guard.py  does the welded page match what src/ says it should
#   tools/lint.py         does the program, assembled and read as one scope,
#                         still have no undefined, unused or twice-declared name
#   tests/regression.js   does the page still DO what it did, in a real browser
#   tests/worker.js       does the write service still refuse what it must
#
# The regression suite runs twice, against two different things: `dist` drives
# the built single file, `src` drives the same program served as separate
# files through src/index.html. They exercise different loading paths, so a
# green run on one says nothing about the other. Each takes around six
# minutes, so they run as two jobs rather than one after the other.
#
# dist/ is not in the repository — it is rebuilt here, attached to the run as
# an artifact, and, on main, it becomes the published site — the same file,
# which is a reader there for everybody but the signed-in owner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, guard and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # There is no package-lock.json yet, so this is `install`, not `ci`.
      # Add a lockfile and this becomes `npm ci`.
      - name: Install eslint
        run: npm install --no-audit --no-fund

      # Before the build, deliberately. A checkout has no dist/, so this is
      # the one moment the chart in the REPOSITORY can be seen on its own —
      # and the repository's copy is what this run publishes. Build first and
      # the comparison becomes a tautology, because dist/ would then have
      # been made from src/ a step earlier.
      - name: What chart this checkout carries
        run: python3 tools/data_check.py

      - name: Build
        run: python3 build.py

      - name: Build guard
        run: python3 tests/build_guard.py

      - name: Lint
        run: npm run lint

      - name: Write service
        run: node tests/worker.js

      - name: Keep the built page with the run
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # The suite is 67 named scenarios and they do not depend on one another —
  # which is checked rather than assumed: four shards print exactly the checks
  # one whole run prints, by name. So they run as shards, and a regression job
  # is about a minute and a half instead of six.
  test:
    name: Regression (${{ matrix.target }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [dist, src]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The src suite serves src/ directly, but building first is what proves
      # the checkout is whole, and it costs seconds.
      - name: Build
        run: python3 build.py

      - name: Run the suite
        run: node tests/regression.js ${{ matrix.target == 'src' && 'src' || '' }} --shard=${{ matrix.shard }}/4

  pages:
    name: Publish to Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: python3 build.py

      # The one file there is. On this address it opens as a reader, and
      # becomes an editor only for the owner, once the write service has
      # confirmed the sign-in — see SITE_ORIGINS in src/app/01-store.js.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp dist/nexus.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # The write service (worker/), deployed to Cloudflare from main.
  #
  # Skipped, with a line saying so, until the repository has the two secrets
  # it needs — so a fork, or this repository before the service is set up,
  # stays green. The service's own secrets (the GitHub App's id and secret,
  # and the session key) live in Cloudflare and a deploy leaves them alone.
  worker:
    name: Deploy the write service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets in this repository; the write service is not deployed."
            exit 0
          fi
          npx --yes wrangler@4 deploy
